# The Clarett 8Pre exposes one 10-channel source with unpositioned AUX channels,
# which browsers can't downmix (Firefox/Meet hear silence). Expose input 1 as a
# plain mono mic and make it the default.
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Clarett Mic (Input 1)"
      capture.props = {
        node.name = "capture.clarett_mic"
        audio.position = [ AUX0 ]
        stream.dont-remix = true
        target.object = "alsa_input.usb-Focusrite_Clarett_8Pre_USB_00006258-00.multichannel-input"
        node.passive = true
      }
      playback.props = {
        node.name = "clarett_mic"
        media.class = "Audio/Source"
        audio.position = [ MONO ]
        priority.session = 2000
      }
    }
  }
]
